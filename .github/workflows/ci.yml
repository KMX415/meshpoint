name: CI

on:
  push:
    branches:
      - main
      # Sprint + feature branches (e.g. feat/v0.7.8) — validate before merge to main.
      - "feat/**"
      - "codex/pimesh-dual-protocol"
  pull_request:
    branches: [main, feat/v0.8.0, feat/wismesh-hat]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.15.22 pytest pytest-asyncio httpx

      - name: Lint
        run: ruff check src/ tests/

      - name: Run tests
        run: python -m pytest tests/ -v --ignore=tests/test_crypto_service.py --ignore=tests/test_meshtastic_decoder.py --ignore=tests/test_meshcore_decoder.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend behavior tests
        run: node --test tests/*.test.cjs tests/frontend/*.test.cjs

      - name: PiMesh UI recovery regressions
        run: node --test tests/test_pimesh_protocol_card.cjs tests/test_pimesh_behavior_card.cjs
